<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Scholara: one platform for schools, consultants, admissions advisors, tutoring centers and programs."><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>"><title>Scholara – Education Management Platform (Demo)</title>
<style>
:root{--navy:#0b1f3f;--navy2:#13305f;--blue:#2f6fed;--soft:#eaf1fe;--bg:#f4f6fb;--tx:#16233b;--mu:#64748b;--bd:#e2e8f0;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit}h2{margin:0;font-size:22px}h3{margin:0 0 10px;font-size:16px}h4{margin:16px 0 6px}
#app{display:flex;min-height:100vh}
.side{width:230px;background:var(--navy);color:#cfdcf5;padding:14px 10px;display:flex;flex-direction:column;gap:4px;transition:width .2s;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.side.c{width:62px}.side.c .lb{display:none}
.logo{color:#fff;font-size:20px;font-weight:700;padding:6px 10px 14px;letter-spacing:.3px}.logo i{color:#7fa8ff;font-style:normal}
.nav{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:8px;border:0;background:none;color:inherit;cursor:pointer;text-align:left;width:100%}
.nav:hover{background:var(--navy2)}.nav.on{background:var(--blue);color:#fff}.nav small{margin-left:auto;font-size:11px;opacity:.7}
.sep{font-size:12px;opacity:.6;padding:12px 12px 2px}
main{flex:1;min-width:0}.top{display:flex;gap:10px;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.badge{background:#fff3cd;color:#7a5200;border:1px solid #f1d27a;padding:2px 10px;border-radius:99px;font-weight:700;font-size:12px}
.banner{background:var(--soft);color:var(--navy);padding:8px 20px;font-size:13px}
.pg{padding:20px;max-width:1200px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stat b{display:block;font-size:26px;color:var(--navy)}.stat span{color:var(--mu);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}.btn:hover{background:#1f5bd6}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--bd)}.btn.red{background:var(--bad)}.btn.sm{padding:3px 9px;font-size:13px}
input,select,textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);max-width:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.tw{overflow-x:auto;padding:0}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:13px;background:#fafbfe}
tr.k{cursor:pointer}tr.k:hover{background:var(--soft)}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none}.av.l{width:64px;height:64px;font-size:22px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--navy)}.Active,.Accepted,.Submitted,.Present,.Done,.Completed,.Graded,.Placed{background:#dcfce7;color:var(--ok)}.Leave,.Waitlisted,.Late,.Pending,.Open,.Scheduled,.Applied,.Assigned,.Shortlisted{background:#fef3c7;color:var(--warn)}.Rejected,.Absent,.Cancelled{background:#fee2e2;color:var(--bad)}
.hb{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.hb div{background:var(--soft);border-radius:99px;height:10px;overflow:hidden}.hb i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.ov{position:fixed;inset:0;background:rgba(11,31,63,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal{background:#fff;border-radius:12px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.fg label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px}.fg .w{grid-column:1/-1}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.err{color:var(--bad);margin:8px 0 0}.ph{display:flex;gap:14px;align-items:center}
.ev{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.ev time{width:96px;color:var(--mu);font-size:13px;flex:none}.ev span.t{flex:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;z-index:30}
ul.l{margin:0;padding-left:18px}ul.l li{margin:4px 0}
@media(max-width:800px){.side{position:fixed;z-index:15;height:100%}.side.c{width:0;padding:0;overflow:hidden}main{margin-left:0}.pg{padding:12px}}
@media print{body.pm #app{display:none}body.pm .ov{position:static;background:none}body.pr .side,body.pr .top,body.pr .banner,.noprint{display:none!important}}
</style></head><body><div id="app"></div><div id="modalRoot"></div>
<script>

classes:mk('name,teacher,room,schedule',[['Grade 12 Mathematics','Ms. Rivera','Room 204','Mon & Wed 9:00'],['Grade 11 Science','Mr. Patel','Lab 2','Tue & Thu 10:30'],['Grade 9 English','Mrs. Adeyemi','Room 108','Mon to Fri 8:00']]),
attendance:mk('date,student,status',[['2026-11-09','Amara Okafor','Present'],['2026-11-09','Ethan Brooks','Absent'],['2026-11-10','Liam Chen','Late'],['2026-11-10','Sofia Martinez','Present']]),
announcements:mk('title,date,audience,message',[['Mid-term exam timetable','2026-11-10','Everyone','Mid-term assessments begin on 23 November. Timetables are on the notice board.'],['Parent-teacher evenings','2026-11-12','Parents','Meetings run 17 to 19 November. Book a slot with the school office.'],['Staff training day','2026-11-16','Teachers','Classroom technology training in the main hall at 2 pm.']]),
consults:mk('student,date,topic,notes',[['Amara Okafor','2026-11-17','Engineering pathway and SAT plan','Parents want a shortlist of 8 universities. Follow up with a timeline.'],['Liam Chen','2026-11-19','Writing support','Agreed on weekly essay practice.'],['Noah Williams','2026-11-24','Math confidence','Introduce a tutor twice a week.']]),
placements:mk('student,school,status',[['Aisha Bello','Riverside Academy','Shortlisted'],['Ethan Brooks','Oakwood Prep','Applied'],['Daniel Kim','Lakeview International','Placed']]),
tasks:mk('task,due,status',[['Send university shortlist to the Okafor family','2026-11-18','Open'],['Collect Liam\'s writing samples','2026-11-20','Open'],['Share progress report with Brooks family','2026-11-10','Done']]),
tutors:mk('name,subject,availability',[['Dr. Amina Yusuf','Mathematics','Mon, Wed 3 to 6 pm'],['Mr. David Cole','English & Writing','Tue, Thu 4 to 7 pm'],['Ms. Priya Nair','Science','Sat 9 am to 1 pm']]),
sessions:mk('student,tutor,date,topic,status',[['Noah Williams','Dr. Amina Yusuf','2026-11-16','Algebra revision','Scheduled'],['Liam Chen','Mr. David Cole','2026-11-17','Essay structure','Scheduled'],['Ethan Brooks','Ms. Priya Nair','2026-11-14','Lab report catch-up','Completed'],['Aisha Bello','Mr. David Cole','2026-11-11','Debate prep','Cancelled']]),
assignments:mk('student,title,due,status',[['Noah Williams','Quadratic equations worksheet','2026-11-18','Assigned'],['Liam Chen','Personal essay draft','2026-11-21','Submitted'],['Ethan Brooks','Photosynthesis lab report','2026-11-13','Graded']]),
programs:mk('name,mentor,start,end',[['Young Leaders Program','Mr. Patel','2026-09-01','2027-06-30'],['STEM Robotics Club','Ms. Rivera','2026-10-01','2027-03-31'],['Writers\' Circle','Mrs. Adeyemi','2026-09-15','2027-05-15']]),
enrolls:mk('student,program,progress',[['Amara Okafor','STEM Robotics Club',80],['Liam Chen','STEM Robotics Club',65],['Aisha Bello','Young Leaders Program',40],['Mia Johnson','Writers\' Circle',55],['Sofia Martinez','Young Leaders Program',90]]),
milestones:mk('program,title,due,status',[['STEM Robotics Club','Build prototype robot','2026-12-05','Pending'],['STEM Robotics Club','Regional competition','2027-02-20','Pending'],['Young Leaders Program','Community service project','2026-11-30','Pending'],['Writers\' Circle','Publish anthology','2026-10-30','Done']]),
achievements:mk('student,title,date',[['Sofia Martinez','Regional science fair winner','2026-10-22'],['Amara Okafor','Robotics club team lead','2026-10-05'],['Mia Johnson','Poetry contest finalist','2026-11-02']])});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ALL=['dashboard','students','school','admissions','consulting','tutoring','programs','calendar','reports'];
const ROLES={Administrator:ALL,'School Owner':ALL,Teacher:['dashboard','students','school','calendar','reports'],Consultant:['dashboard','students','admissions','consulting','calendar','reports'],Tutor:['dashboard','students','tutoring','calendar'],Student:['dashboard','calendar']};
const NAV={dashboard:['Dashboard','▦'],students:['Students','👥'],school:['School management','🏫'],admissions:['College admissions','🎓'],consulting:['Consulting','🧭'],tutoring:['Tutoring center','✏️'],programs:['Programs','🏅'],calendar:['Calendar','📅'],reports:['Reports','📊']};
const SOON=['School management','Consulting','Tutoring center','Programs & milestones'];
let role='Administrator',page='dashboard',q='',fs='All',gf='All',col=innerWidth<800;
const canEdit=()=>['Administrator','School Owner','Teacher','Consultant'].includes(role);
const avg=g=>Math.round(Object.values(g).reduce((a,b)=>a+b,0)/Object.values(g).length);
const gl=v=>v>=90?'A':v>=80?'B':v>=70?'C':'D',ini=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');
const COLS=['#2f6fed','#0e7490','#7c3aed','#be185d','#b45309','#15803d','#334155','#1d4ed8'];
const av=(s,l)=>s.photo?`<img class="av ${l?'l':''}" src="${s.photo}" alt="" style="object-fit:cover">`:`<span class="av ${l?'l':''}" style="background:${COLS[s.id%8]}">${ini(s.name)}</span>`;
const hb=(l,v)=>`<div class=hb><span>${esc(l)}</span><div><i style="width:${v}%"></i></div><b>${v}</b></div>`;
const sn=id=>(S.students.find(s=>s.id==id)||{name:'Unknown'}).name;
const vis=()=>role=='Student'?S.students.slice(0,1):S.students;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function modal(h){$('#modalRoot').innerHTML=`<div class=ov onclick="if(event.target==this)closeM()"><div class=modal>${h}</div></div>`}
const closeM=()=>$('#modalRoot').innerHTML='';
function formModal(t,fl,v,cb){window._ph=null;modal(`<h3>${t}</h3><div class=fg>${fl.map(([k,l,ty,o])=>`<label class="${ty=='area'?'w':''}">${l}${ty=='select'?`<select id=f_${k}>${(typeof o=='function'?o():o).map(x=>`<option ${x==v[k]?'selected':''}>${esc(x)}</option>`).join('')}</select>`:ty=='area'?`<textarea id=f_${k} rows=3>${esc(v[k]||'')}</textarea>`:`<input id=f_${k} type=${ty} ${ty=='file'?'accept=image/* onchange=pick(this)':`value="${esc(v[k]||'')}"`}>`}</label>`).join('')}</div><p id=err class=err></p><div class=row><button class="btn ghost" onclick=closeM()>Cancel</button><button class=btn onclick=submitF()>Save</button></div>`);
window.submitF=()=>{const o={};for(const[k,l,ty]of fl){if(ty=='file'){o[k]=window._ph||v[k]||'';continue}o[k]=$('#f_'+k).value.trim();if(!o[k]&&!['phone','scholar','goals','notes'].includes(k))return $('#err').textContent=l+' is required.';if(ty=='email'&&!/^\S+@\S+\.\S+$/.test(o[k]))return $('#err').textContent='Enter a valid email address.'}cb(o);closeM()}}
function doPrint(m){document.body.className=m;print();document.body.className=''}
const go=p=>{page=p;render()};
function render(){const allowed=ROLES[role];if(!allowed.includes(page))page='dashboard';
$('#app').innerHTML=`<nav class="side ${col?'c':''}"><div class=logo>🎓<span class=lb> Schola<i>ra</i></span></div>${allowed.map(p=>`<button class="nav ${p==page?'on':''}" onclick="go('${p}')" title="${NAV[p][0]}"><span>${NAV[p][1]}</span><span class=lb>${NAV[p][0]}</span></button>`).join('')}</nav>
<main><div class=top><button class="btn ghost sm" onclick="col=!col;render()" aria-label="Toggle menu">☰</button><span class=badge>DEMO MODE</span><span style="flex:1"></span><label>Viewing as <select onchange="role=this.value;render()">${Object.keys(ROLES).map(r=>`<option ${r==role?'selected':''}>${r}</option>`).join('')}</select></label><button class="btn ghost sm" onclick="resetD()">Reset demo data</button></div>
<div class=banner>Demo mode: all names and records are fictional. Changes are saved only in this browser.</div><div class=pg>${({dashboard:dash,students:stu,admissions:adm,calendar:cal,reports:rep}[page]||mod)()}</div></main>`}
function resetD(){if(confirm('Reset all demo data to the original sample records?')){S=seed();save();render();toast('Demo data reset')}}
const upEv=()=>S.events.filter(e=>e.date>=TODAY).sort((a,b)=>a.date>b.date?1:-1);
function dash(){let st=vis();if(gf!='All')st=st.filter(s=>s.grade==gf);const n=st.length,m=f=>n?Math.round(st.reduce((a,s)=>a+f(s),0)/n):0;
const bars=st.map((s,i)=>{const h=s.att*1.3;return `<rect x="${i*46+8}" y="${140-h}" width="30" height="${h}" rx="4" fill="#2f6fed"/><text x="${i*46+23}" y="154" font-size="10" text-anchor="middle" fill="#64748b">${esc(s.name.split(' ')[0].slice(0,6))}</text><text x="${i*46+23}" y="${134-h}" font-size="10" text-anchor="middle" fill="#0b1f3f">${s.att}</text>`}).join('');
return `<div class=bar><h2>Welcome, ${role}</h2><label>Filter <select onchange="gf=this.value;render()">${['All',9,10,11,12].map(x=>`<option value=${x} ${x==gf?'selected':''}>${x=='All'?'All grades':'Grade '+x}</option>`).join('')}</select></label></div>
<div class=stats>${[['Total students',n],['Active teachers & staff',S.teachers.length],['Active programs',S.programs.length],['Upcoming deadlines',S.apps.filter(a=>a.deadline>=TODAY).length],['Average attendance',m(s=>s.att)+'%'],['Average score',m(s=>avg(s.g))+'%']].map(a=>`<div class="card stat"><b>${a[1]}</b><span>${a[0]}</span></div>`).join('')}</div>
<div class=grid2><div class=card><h3>Student progress (average score)</h3>${st.map(s=>hb(s.name.split(' ')[0],avg(s.g))).join('')||'No students in this grade.'}</div><div class=card><h3>Attendance (%)</h3><svg viewBox="0 0 ${Math.max(st.length,1)*46+10} 160" style="width:100%;max-height:200px">${bars}</svg></div></div>
<div class=grid2><div class=card><h3>Upcoming appointments & deadlines</h3>${upEv().slice(0,5).map(e=>`<div class=ev><time>${e.date}</time><span class=t>${esc(e.title)}</span><span class=tag>${e.type}</span></div>`).join('')}</div>
<div class=card><h3>Recent activity</h3><ul class=l><li>Sofia Martinez accepted by University of Toronto</li><li>Georgia Tech application submitted for Amara Okafor</li><li>Mid-term grades entered for Grade 10</li><li>New parent message from the Brooks family</li></ul><h3 style="margin-top:14px">Notifications</h3><ul class=l><li>3 essays awaiting review</li><li>Financial aid forms due Nov 20</li></ul></div></div>`}
const rows=()=>vis().filter(s=>(fs=='All'||s.status==fs)&&(s.name+s.teacher).toLowerCase().includes(q.toLowerCase())).map(s=>`<tr class=k onclick="prof(${s.id})"><td>${av(s)} ${esc(s.name)}</td><td>${s.grade}</td><td>${esc(s.teacher)}</td><td>${avg(s.g)}% (${gl(avg(s.g))})</td><td>${s.att}%</td><td><span class="tag ${s.status}">${s.status}</span></td></tr>`).join('')||'<tr><td colspan=6>No students match. Clear the search or filter.</td></tr>';
const stu=()=>`<div class=bar><h2>Students</h2>${canEdit()?'<button class=btn onclick="editS()">Add student</button>':''}</div><div class=bar style="justify-content:flex-start"><input placeholder="Search by name or teacher" value="${esc(q)}" oninput="q=this.value;$('#list').innerHTML=rows()"><select onchange="fs=this.value;$('#list').innerHTML=rows()">${['All','Active','On Leave','Graduated'].map(x=>`<option ${x==fs?'selected':''}>${x}</option>`).join('')}</select></div><div class="card tw"><table><thead><tr><th>Student<th>Grade<th>Advisor<th>Score<th>Attendance<th>Status</thead><tbody id=list>${rows()}</tbody></table></div>`;
function editS(id){const s=S.students.find(x=>x.id==id)||{status:'Active',grade:9,teacher:(S.teachers[0]||{}).name,enrolled:TODAY,att:90,g:{Math:75,English:75,Science:75,History:75}},cl=n=>Math.max(0,Math.min(100,+n||0)),SB=['Math','English','Science','History'];
formModal(id?'Edit student':'Add student',[['name','Full name','text'],['photo','Photo (optional)','file'],['grade','Grade','select',[9,10,11,12]],['status','Status','select',['Active','On Leave','Graduated']],['teacher','Assigned teacher / advisor','select',()=>S.teachers.map(t=>t.name)],['guardian','Parent / guardian','text'],['phone','Phone','text'],['email','Email','email'],['enrolled','Enrollment date','date'],['att','Attendance % (0-100)','number'],...SB.map(k=>[k,k+' score (0-100)','number']),['goals','Learning goals','area']],{...s,...s.g},o=>{const d={...o,grade:+o.grade,att:cl(o.att),g:{}};SB.forEach(k=>{d.g[k]=cl(o[k]);delete d[k]});if(id)Object.assign(s,d);else S.students.push({id:uid(),...d});save();render();toast('Student saved')})}
function prof(id){const s=S.students.find(x=>x.id==id),ap=S.apps.filter(a=>a.sid==id);
modal(`<div class=ph>${av(s,1)}<div><h3 style="margin:0">${esc(s.name)}</h3><span class="tag ${s.status}">${s.status}</span><div style="color:var(--mu)">Grade ${s.grade}, advisor ${esc(s.teacher)}</div></div></div>
<div class=fg style="margin-top:12px"><div><small>Guardian</small><br>${esc(s.guardian)}</div><div><small>Contact</small><br>${esc(s.phone)}<br>${esc(s.email)}</div><div><small>Enrolled</small><br>${s.enrolled}</div><div><small>Attendance</small><br>${s.att}%</div></div>
<h4>Report card: ${avg(s.g)}% overall (${gl(avg(s.g))})</h4>${Object.entries(s.g).map(([k,v])=>hb(k+' '+gl(v),v)).join('')}<h4>Learning goals</h4><div>${esc(s.goals)}</div>
<h4>College applications</h4>${ap.length?`<ul class=l>${ap.map(a=>`<li>${esc(a.college)}: ${a.status}</li>`).join('')}</ul>`:'None yet.'}
<div class="row noprint"><button class="btn ghost" onclick="doPrint('pm')">Print report card</button>${canEdit()?`<button class="btn ghost" onclick="editS(${id})">Edit</button><button class="btn red" onclick="delS(${id})">Delete</button>`:''}<button class=btn onclick=closeM()>Close</button></div>`)}
function delS(id){if(confirm('Delete this student and their applications?')){S.students=S.students.filter(s=>s.id!=id);S.apps=S.apps.filter(a=>a.sid!=id);save();closeM();render();toast('Student deleted')}}
function adm(){const c=STAT.map(x=>`<div class="card stat"><b>${S.apps.filter(a=>a.status==x).length}</b><span>${x}</span></div>`).join('');
return `<div class=bar><h2>College admissions</h2><button class=btn onclick="editA()">Add application</button></div><div class=stats>${c}</div><div class="card tw"><table><thead><tr><th>Student<th>College<th>Deadline<th>Decision<th>Status<th>Scholarship<th></thead><tbody>${[...S.apps].sort((a,b)=>a.deadline>b.deadline?1:-1).map(a=>`<tr><td>${esc(sn(a.sid))}<td>${esc(a.college)}<td>${a.deadline}<td>${a.decision}<td><select onchange="setSt(${a.id},this.value)">${STAT.map(x=>`<option ${x==a.status?'selected':''}>${x}</option>`).join('')}</select><td>${esc(a.scholar||'None')}<td><button class="btn ghost sm" onclick="editA(${a.id})">Edit</button> <button class="btn ghost sm" onclick="delA(${a.id})">Delete</button></tr>`).join('')}</tbody></table></div>`}
const setSt=(id,v)=>{S.apps.find(a=>a.id==id).status=v;save();render();toast('Status updated')};
const delA=id=>{if(confirm('Delete this application?')){S.apps=S.apps.filter(a=>a.id!=id);save();render()}};
function editA(id){const a=S.apps.find(x=>x.id==id)||{status:'Researching',deadline:TODAY,decision:TODAY,sid:S.students[0]?.id};
formModal(id?'Edit application':'Add application',[['student','Student','select',S.students.map(s=>s.name)],['college','College or university','text'],['deadline','Deadline','date'],['decision','Expected decision','date'],['status','Status','select',STAT],['scholar','Scholarship or aid (optional)','text']],{...a,student:sn(a.sid)},o=>{const sid=S.students.find(s=>s.name==o.student)?.id;const d={sid,college:o.college,deadline:o.deadline,decision:o.decision,status:o.status,scholar:o.scholar};if(id)Object.assign(a,d);else S.apps.push({id:uid(),...d});save();render();toast('Application saved')})}
function cal(){return `<div class=bar><h2>Calendar</h2><button class=btn onclick="editE()">Add event</button></div><div class=card>${[...S.events].sort((a,b)=>a.date>b.date?1:-1).map(e=>`<div class=ev><time>${e.date}</time><span class=t>${esc(e.title)}</span><span class=tag>${e.type}</span>${role=='Student'?'':`<button class="btn ghost sm" onclick="editE(${e.id})">Edit</button><button class="btn ghost sm" onclick="delE(${e.id})">Delete</button>`}</div>`).join('')||'No events yet. Add your first event.'}</div>`}
const delE=id=>{S.events=S.events.filter(e=>e.id!=id);save();render()};
function editE(id){const e=S.events.find(x=>x.id==id)||{date:TODAY,type:'Meeting'};formModal(id?'Edit event':'Add event',[['title','Title','text'],['date','Date','date'],['type','Type','select',EVT]],e,o=>{if(id)Object.assign(e,o);else S.events.push({id:uid(),...o});save();render();toast('Event saved')})}
let rt='Performance';
function repData(){if(rt=='Performance')return[['Student','Grade','Math','English','Science','History','Average'],vis().map(s=>[s.name,s.grade,...Object.values(s.g),avg(s.g)])];
if(rt=='Programs')return[['Program','Mentor','Enrolled','Avg progress %','Milestones done'],S.programs.map(p=>{const e=S.enrolls.filter(x=>x.program==p.name),m=S.milestones.filter(x=>x.program==p.name);return[p.name,p.mentor,e.length,e.length?Math.round(e.reduce((a,x)=>a+x.progress,0)/e.length):0,m.filter(x=>x.status=='Done').length+' of '+m.length]})];if(rt=='Teachers')return[['Teacher','Subject','Advisees','Avg advisee score %'],S.teachers.map(t=>{const a=S.students.filter(x=>x.teacher==t.name);return[t.name,t.subject,a.length,a.length?Math.round(a.reduce((x,y)=>x+avg(y.g),0)/a.length):'-']})];if(rt=='Attendance')return[['Student','Grade','Advisor','Attendance %'],vis().map(s=>[s.name,s.grade,s.teacher,s.att])];
return[['Student','College','Deadline','Status'],S.apps.map(a=>[sn(a.sid),a.college,a.deadline,a.status])]}
function rep(){const[h,r]=repData();return `<div class="bar noprint"><h2>Reports</h2><span><button class="btn ghost" onclick="doPrint('pr')">Print</button> <button class=btn onclick="csv()">Download CSV</button></span></div><div class="bar noprint" style="justify-content:flex-start">${['Performance','Attendance','Applications','Programs','Teachers'].map(x=>`<button class="btn ${x==rt?'':'ghost'}" onclick="rt='${x}';render()">${x}</button>`).join('')}</div><h3>${rt} report</h3><div class="card tw"><table><thead><tr>${h.map(x=>`<th>${x}`).join('')}</thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}`).join('')}</tr>`).join('')}</tbody></table></div>`}
function csv(){const[h,r]=repData(),t=[h,...r].map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=rt.toLowerCase()+'-report.csv';a.click()}
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=Math.min(1,160/Math.max(im.width,im.height));c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);window._ph=c.toDataURL('image/jpeg',.8)};im.src=r.result};r.readAsDataURL(f)}
const ST=()=>S.students.map(s=>s.name),TN=()=>S.teachers.map(t=>t.name),PN=()=>S.programs.map(p=>p.name);
const MODS={school:{t:'School management',tabs:[['teachers','Teachers & staff',[['name','Name','text'],['subject','Subject or role','text'],['email','Email','email'],['status','Status','select',['Active','On Leave']]]],['classes','Classes & schedule',[['name','Class or subject','text'],['teacher','Teacher','select',TN],['room','Room','text'],['schedule','Schedule','text']]],['attendance','Attendance log',[['date','Date','date'],['student','Student','select',ST],['status','Status','select',['Present','Absent','Late']]]],['announcements','Announcements',[['title','Title','text'],['date','Date','date'],['audience','Audience','select',['Everyone','Parents','Teachers','Students']],['message','Message','area']]]]},
consulting:{t:'Educational consulting',tabs:[['consults','Consultations & notes',[['student','Student','select',ST],['date','Date','date'],['topic','Topic','text'],['notes','Notes','area']]],['placements','School placements',[['student','Student','select',ST],['school','School','text'],['status','Status','select',['Shortlisted','Applied','Placed']]]],['tasks','Follow-up tasks',[['task','Task','text'],['due','Due date','date'],['status','Status','select',['Open','Done']]]]]},
tutoring:{t:'Tutoring center',tabs:[['sessions','Sessions',[['student','Student','select',ST],['tutor','Tutor','select',()=>S.tutors.map(t=>t.name)],['date','Date','date'],['topic','Topic','text'],['status','Status','select',['Scheduled','Completed','Cancelled']]]],['tutors','Tutors & availability',[['name','Name','text'],['subject','Subject','text'],['availability','Availability','text']]],['assignments','Assignments',[['student','Student','select',ST],['title','Assignment','text'],['due','Due date','date'],['status','Status','select',['Assigned','Submitted','Graded']]]]]},
programs:{t:'Programs & milestones',tabs:[['programs','Programs',[['name','Program','text'],['mentor','Mentor','select',TN],['start','Start','date'],['end','End','date']]],['enrolls','Enrollment & progress',[['student','Student','select',ST],['program','Program','select',PN],['progress','Progress','number']]],['milestones','Milestones',[['program','Program','select',PN],['title','Milestone','text'],['due','Due date','date'],['status','Status','select',['Pending','Done']]]],['achievements','Achievements',[['student','Student','select',ST],['title','Achievement','text'],['date','Date','date']]]]}};
let tab={},mq='';
const curT=()=>{const m=MODS[page],k=tab[page]||m.tabs[0][0];return[k,m.tabs.find(x=>x[0]==k)]};
const mrows=()=>{const[k,T]=curT(),r=S[k].filter(x=>JSON.stringify(x).toLowerCase().includes(mq.toLowerCase()));return r.map(x=>`<tr>${T[2].map(f=>`<td>${f[0]=='status'?`<span class="tag ${esc(x.status)}">${esc(x.status)}</span>`:f[2]=='number'?esc(x[f[0]])+'%':esc(x[f[0]])}`).join('')}<td><button class="btn ghost sm" onclick="editM(${x.id})">Edit</button> <button class="btn ghost sm" onclick="delM(${x.id})">Delete</button></tr>`).join('')||'<tr><td colspan=9>No records match. Add a record or clear the search.</td></tr>'};
function mod(){const m=MODS[page],[k,T]=curT();return `<div class=bar><h2>${m.t}</h2></div><div class=bar style="justify-content:flex-start">${m.tabs.map(x=>`<button class="btn ${x[0]==k?'':'ghost'}" onclick="tab[page]='${x[0]}';mq='';render()">${x[1]}</button>`).join('')}</div><div class=bar style="justify-content:flex-start"><input placeholder="Search records" value="${esc(mq)}" oninput="mq=this.value;$('#ml').innerHTML=mrows()"><button class=btn onclick="editM()">Add record</button></div><div class="card tw"><table><thead><tr>${T[2].map(f=>`<th>${f[1]}`).join('')}<th></thead><tbody id=ml>${mrows()}</tbody></table></div>`}
function editM(id){const[k,T]=curT(),r=S[k].find(x=>x.id==id)||{};formModal((id?'Edit':'Add')+' record',T[2].map(f=>f[2]=='number'?[f[0],f[1]+' (0-100)','number']:f),r,o=>{T[2].forEach(f=>{if(f[2]=='number')o[f[0]]=Math.max(0,Math.min(100,+o[f[0]]||0))});if(id)Object.assign(r,o);else S[k].push({id:uid(),...o});save();render();toast('Record saved')})}
const delM=id=>{const[k]=curT();if(confirm('Delete this record?')){S[k]=S[k].filter(x=>x.id!=id);save();render()}};
render();
</script></body></html>
